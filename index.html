    <script>
      // Apply the saved design before first paint (A / B / C / D, see src/theme.jsx).
      try {
        // Default design comes from VITE_DEFAULT_THEME (see .env.example); falls back to "a".
        var d = "%VITE_DEFAULT_THEME%";
        if (["a", "b", "c", "d"].indexOf(d) < 0) d = "a";
        var q = new URLSearchParams(location.search).get("theme");
        var t = (q || localStorage.getItem("k12-theme") || d).toLowerCase();
        if (["a", "b", "c", "d"].indexOf(t) > -1) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
